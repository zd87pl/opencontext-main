[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "contracts/test"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.24"

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
base = "${BASE_RPC_URL}"
zksync_sepolia = "https://sepolia.era.zksync.dev"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
base = { key = "${BASESCAN_API_KEY}" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true