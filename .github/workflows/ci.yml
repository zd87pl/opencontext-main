name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch/PR at a time; a newer push supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-js:
    name: sdk-js (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  sdk-python:
    name: sdk-python (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Only Poetry's download caches are kept, never its virtualenvs: a restored venv
      # would point at an interpreter path that changes whenever the patch release bumps.
      - name: Cache Poetry downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry/cache
            ~/.cache/pypoetry/artifacts
          key: poetry-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('sdk/python/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py${{ matrix.python }}-
      - run: pip install poetry
      - run: poetry install
      - run: poetry run pytest -q
      - run: poetry run mypy --strict opencontext

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # `npm ci` also runs `prisma generate` (via @prisma/client's postinstall hook),
      # which produces the generated client that `npm run typecheck` depends on.
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Foundry dependencies live in lib/ as git submodules (see .gitmodules), so the
      # recursive checkout is what installs them; no `forge install` step is needed.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge build
      - run: forge test -vv
      - run: forge fmt --check
