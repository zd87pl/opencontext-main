version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: opencontext-postgres
    environment:
      POSTGRES_DB: opencontext_demo
      POSTGRES_USER: opencontext
      POSTGRES_PASSWORD: demo_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./demo/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencontext -d opencontext_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opencontext-network

  # Redis for Sessions and Caching
  redis:
    image: redis:7-alpine
    container_name: opencontext-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass demo_redis_2024
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - opencontext-network

  # OpenContext Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.demo
    container_name: opencontext-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://opencontext:demo_password_2024@postgres:5432/opencontext_demo
      REDIS_URL: redis://:demo_redis_2024@redis:6379
      JWT_SECRET: demo_jwt_secret_opencontext_2024_very_secure
      SESSION_SECRET: demo_session_secret_opencontext_2024_very_secure
      WALLET_ENCRYPTION_KEY: abcd1234567890abcd1234567890abcd1234567890abcd1234567890abcd1234
      
      # Stripe Configuration (Demo Keys)
      STRIPE_SECRET_KEY: sk_test_51234567890abcdefghijklmnopqrstuvwxyz
      STRIPE_WEBHOOK_SECRET: whsec_demo_webhook_secret_2024
      STRIPE_PUBLISHABLE_KEY: pk_test_51234567890abcdefghijklmnopqrstuvwxyz
      
      # CORS and Security
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3002,http://opencontext-frontend:3000
      
      # OAuth Configuration (Demo)
      GOOGLE_CLIENT_ID: demo_google_client_id.googleusercontent.com
      GOOGLE_CLIENT_SECRET: demo_google_client_secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/auth/google/callback
      
      GITHUB_CLIENT_ID: demo_github_client_id
      GITHUB_CLIENT_SECRET: demo_github_client_secret
      GITHUB_CALLBACK_URL: http://localhost:3001/auth/github/callback
      
      # Demo Configuration
      DEMO_MODE: true
      AUTO_SEED_DATA: true
      ENABLE_DEMO_PAYMENTS: true
      
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./demo/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - opencontext-network
    restart: unless-stopped

  # React Frontend Demo App
  frontend:
    build:
      context: ./demo/frontend
      dockerfile: Dockerfile
    container_name: opencontext-frontend
    environment:
      REACT_APP_API_URL: http://localhost:3001
      REACT_APP_STRIPE_PUBLISHABLE_KEY: pk_test_51234567890abcdefghijklmnopqrstuvwxyz
      REACT_APP_DEMO_MODE: true
      REACT_APP_ENABLE_OAUTH: true
    ports:
      - "3000:3000"
    volumes:
      - ./demo/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - opencontext-network
    restart: unless-stopped

  # WordPress Demo Instance
  wordpress:
    image: wordpress:6.4-apache
    container_name: opencontext-wordpress
    environment:
      WORDPRESS_DB_HOST: postgres:5432
      WORDPRESS_DB_USER: opencontext
      WORDPRESS_DB_PASSWORD: demo_password_2024
      WORDPRESS_DB_NAME: wordpress_demo
      WORDPRESS_TABLE_PREFIX: wp_demo_
      
      # Auto-install WordPress
      WORDPRESS_TITLE: "OpenContext Demo Blog"
      WORDPRESS_ADMIN_USER: admin
      WORDPRESS_ADMIN_PASSWORD: demo_admin_2024
      WORDPRESS_ADMIN_EMAIL: demo@opencontext.network
      WORDPRESS_URL: http://localhost:3002
      
    ports:
      - "3002:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress-plugin:/var/www/html/wp-content/plugins/opencontext-wp
      - ./demo/wordpress/themes:/var/www/html/wp-content/themes/opencontext-demo
      - ./demo/wordpress/uploads:/var/www/html/wp-content/uploads
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - opencontext-network
    restart: unless-stopped

  # Blockchain Simulator (Mock zkSync/Base)
  blockchain-sim:
    build:
      context: ./demo/blockchain-simulator
      dockerfile: Dockerfile
    container_name: opencontext-blockchain
    environment:
      PORT: 8545
      NETWORK_ID: 280
      CHAIN_NAME: "zkSync Era Testnet"
      AUTO_MINE: true
      DEMO_CONTRACTS: true
    ports:
      - "8545:8545"
    volumes:
      - blockchain_data:/data
      - ./contracts:/contracts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - opencontext-network
    restart: unless-stopped

  # Demo Data Seeder
  seeder:
    build:
      context: ./demo/seeder
      dockerfile: Dockerfile
    container_name: opencontext-seeder
    environment:
      DATABASE_URL: postgresql://opencontext:demo_password_2024@postgres:5432/opencontext_demo
      BACKEND_URL: http://backend:3001
      WORDPRESS_URL: http://wordpress
      BLOCKCHAIN_URL: http://blockchain-sim:8545
      DEMO_USERS_COUNT: 10
      DEMO_CONTENT_COUNT: 50
      DEMO_PURCHASES_COUNT: 100
    volumes:
      - ./demo/data:/data
    depends_on:
      backend:
        condition: service_healthy
      wordpress:
        condition: service_started
      blockchain-sim:
        condition: service_healthy
    networks:
      - opencontext-network
    profiles:
      - seeding

  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: opencontext-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./demo/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./demo/nginx/ssl:/etc/nginx/ssl
      - ./demo/static:/var/www/static
    depends_on:
      - backend
      - frontend
      - wordpress
    networks:
      - opencontext-network
    restart: unless-stopped

  # Monitoring & Analytics
  prometheus:
    image: prom/prometheus:latest
    container_name: opencontext-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./demo/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - opencontext-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: opencontext-grafana
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: demo_grafana_2024
    volumes:
      - grafana_data:/var/lib/grafana
      - ./demo/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - opencontext-network
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  wordpress_data:
  blockchain_data:
  prometheus_data:
  grafana_data:

networks:
  opencontext-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16